<script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadString, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        // Firebase Credentials Config
        const firebaseConfig = {
            apiKey: "AIzaSyYourOwnAPIKeyHere_ExampleOnly",
            authDomain: "your-project-id.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-project-id.appspot.com",
            messagingSenderId: "123456789012",
            appId: "1:123456789012:web:abcdef123456"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // Map Param Setup
        const map = L.map('map', { crs: L.CRS.Simple, minZoom: -3, maxZoom: 1 });
        const mapBounds = [[0, 0], [916, 2200]];
        let currentImageOverlay = null, temporaryMarker = null, currentActiveFloor = 1, selectedFilterDateString = null;
        let currentCalendarDate = new Date();
        
        let hazards = []; 
        const floorLabels = { 1: "Ground Floor", 2: "First Floor", 3: "Car Park", 4: "Service Yards" };
        
        const floorPlanImages = {
            1: localStorage.getItem('active_floorplan_image_slot1'),
            2: localStorage.getItem('active_floorplan_image_slot2'),
            3: localStorage.getItem('active_floorplan_image_slot3'),
            4: localStorage.getItem('active_floorplan_image_slot4')
        };

        refreshFloorSlotButtons();
        applyFloorplanImage(floorPlanImages[currentActiveFloor]);

        // Optimized Query structure preventing index errors on initial deployment
        const hazardsRef = collection(db, "hazards");
        const q = query(hazardsRef); 

        onSnapshot(q, (snapshot) => {
            hazards.forEach(h => { if (h.marker) map.removeLayer(h.marker); });
            hazards = [];
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                data.docId = docSnap.id; 
                hazards.push(data);
            });
            
            // Client side ordering to fallback safely without complex indexing rules
            hazards.sort((a, b) => b.id - a.id);

            synchronizeMarkerLayers();
            renderCalendar();
            updateSidebar();
        }, (error) => {
            console.error("Firebase Sync Error: ", error);
        });

        function refreshFloorSlotButtons() {
            for (let i = 1; i <= 4; i++) {
                const btn = document.getElementById(`floor-btn-${i}`);
                if(btn) {
                    btn.classList.toggle('has-map', !!floorPlanImages[i]);
                    btn.classList.toggle('active', i === currentActiveFloor);
                }
            }
        }

        function selectFloorSlot(floorNum) {
            if (currentActiveFloor === floorNum && !floorPlanImages[floorNum]) {
                document.getElementById('floorplan-file-hidden').click();
                return;
            }
            currentActiveFloor = floorNum;
            refreshFloorSlotButtons();
            
            if (floorPlanImages[floorNum]) {
                applyFloorplanImage(floorPlanImages[floorNum]);
            } else {
                if (currentImageOverlay) { map.removeLayer(currentImageOverlay); currentImageOverlay = null; }
                document.getElementById('map-placeholder').style.display = 'block';
            }
            synchronizeMarkerLayers();
            updateSidebar();
        }

        function handleFloorplanUpload(inputElement) {
            if (inputElement.files && inputElement.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    floorPlanImages[currentActiveFloor] = e.target.result;
                    localStorage.setItem(`active_floorplan_image_slot${currentActiveFloor}`, e.target.result);
                    refreshFloorSlotButtons();
                    applyFloorplanImage(e.target.result);
                };
                reader.readAsDataURL(inputElement.files[0]);
            }
        }

        function applyFloorplanImage(base64Data) {
            if (!base64Data) { document.getElementById('map-placeholder').style.display = 'block'; return; }
            if (currentImageOverlay) { map.removeLayer(currentImageOverlay); }
            currentImageOverlay = L.imageOverlay(base64Data, mapBounds).addTo(map);
            map.invalidateSize();
            map.setView([458, 1100], -2);
            document.getElementById('map-placeholder').style.display = 'none';
        }

        function makeIsoDateString(dateObj) {
            return `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}-${String(dateObj.getDate()).padStart(2, '0')}`;
        }

        function synchronizeMarkerLayers() {
            hazards.forEach(hazard => {
                if (hazard.marker) { map.removeLayer(hazard.marker); hazard.marker = null; }
                if ((hazard.floorSlot || 1) === currentActiveFloor && (!selectedFilterDateString || hazard.isoDate === selectedFilterDateString)) {
                    hazard.marker = L.marker([hazard.lat, hazard.lng]).addTo(map);
                    updateMarkerPopup(hazard.marker, hazard);
                }
            });
        }

        map.on('click', function(e) {
            if (!floorPlanImages[currentActiveFloor]) return;
            if (temporaryMarker) { map.removeLayer(temporaryMarker); }

            const lat = e.latlng.lat, lng = e.latlng.lng;
            temporaryMarker = L.marker([lat, lng]).addTo(map);
            
            temporaryMarker.bindPopup(`
                <div class="popup-form">
                    <label>Staff Member Name</label>
                    <input type="text" id="hazard-staff" placeholder="e.g., Alex Johnson" autofocus>
                    <label>Date & Time</label>
                    <input type="text" id="hazard-time" value="${new Date().toLocaleString()}" readonly>
                    <label>Map Area Location</label>
                    <input type="text" id="hazard-coords" value="${floorLabels[currentActiveFloor]} - Y: ${lat.toFixed(0)}, X: ${lng.toFixed(0)}" readonly>
                    <label>Hazard</label>
                    <input type="text" id="hazard-title" placeholder="e.g., Spillage">
                    <label>Description</label>
                    <textarea id="hazard-desc"></textarea>
                    <div class="popup-photo-container">
                        <label>📸 Close-up Photo:</label>
                        <input type="file" id="hazard-closeup-img" accept="image/*" capture="environment">
                        <label>🌐 Wide-angle Photo:</label>
                        <input type="file" id="hazard-wideangle-img" accept="image/*" capture="environment">
                    </div>
                    <button id="popup-submit-btn">Submit Report</button>
                </div>
            `).openPopup();
        });

        map.on('popupopen', function() {
            const btn = document.getElementById('popup-submit-btn');
            if (btn) {
                // Extracts internal variables dynamically for closure assignment
                const matches = document.getElementById('hazard-coords').value.match(/Y:\s*([\d.-]+),\s*X:\s*([\d.-]+)/);
                if(matches) {
                    btn.onclick = () => saveHazard(parseFloat(matches[1]), parseFloat(matches[2]));
                }
            }
        });

        function compressAndConvertImage(file) {
            return new Promise((resolve) => {
                if (!file) { resolve(null); return; }
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function(event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height, max = 800;
                        if (width > height ? width > max : height > max) {
                            width > height ? (height *= max / width, width = max) : (width *= max / height, height = max);
                        }
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7));
                    };
                };
            });
        }

        async function uploadPhotoToCloudStorage(base64Data, filename) {
            if (!base64Data) return null;
            try {
                const storageRef = ref(storage, `hazard_photos/${filename}_${Date.now()}.jpg`);
                await uploadString(storageRef, base64Data, 'data_url');
                return await getDownloadURL(storageRef);
            } catch(e) {
                console.error("Storage Error:", e);
                return null;
            }
        }

        async function saveHazard(lat, lng) {
            const staff = document.getElementById('hazard-staff').value.trim();
            const title = document.getElementById('hazard-title').value.trim();
            if (!staff || !title) { alert("Staff name and Hazard title are required!"); return; }

            const submitBtn = document.getElementById('popup-submit-btn');
            submitBtn.innerText = "Uploading to Cloud...";
            submitBtn.disabled = true;

            const closeupBase64 = await compressAndConvertImage(document.getElementById('hazard-closeup-img').files[0]);
            const wideangleBase64 = await compressAndConvertImage(document.getElementById('hazard-wideangle-img').files[0]);

            const closeupUrl = await uploadPhotoToCloudStorage(closeupBase64, "closeup");
            const wideangleUrl = await uploadPhotoToCloudStorage(wideangleBase64, "wideangle");

            const newHazard = {
                id: Date.now(),
                floorSlot: currentActiveFloor,
                staff: staff,
                timestamp: document.getElementById('hazard-time').value,
                isoDate: makeIsoDateString(new Date()),
                coordinates: document.getElementById('hazard-coords').value,
                title: title,
                description: document.getElementById('hazard-desc').value.trim(),
                lat: lat, lng: lng, status: 'Unresolved',
                closeupPhoto: closeupUrl,
                wideanglePhoto: wideangleUrl,
                interimPhoto: null,
                afterPhoto: null
            };

            try {
                await addDoc(collection(db, "hazards"), newHazard);
                map.closePopup();
                if (temporaryMarker) { map.removeLayer(temporaryMarker); temporaryMarker = null; }
            } catch (err) {
                console.error("Cloud Database Write Refused: ", err);
                alert("Database entry error encountered: " + err.message);
                submitBtn.innerText = "Submit Report";
                submitBtn.disabled = false;
            }
        }

        function updateMarkerPopup(marker, hazard) {
            const colors = { 'Unresolved': '#e74c3c', 'Resolved': '#2ecc71', 'Made Safe': '#f39c12' };
            marker.bindPopup(`
                <div style="max-width: 250px;">
                    <b style="font-size:1.1rem; color:${colors[hazard.status] || '#333'};">${hazard.title}</b><br>
                    <span style="font-size:0.75rem; color:#666;">By: ${hazard.staff} on ${hazard.timestamp}</span><br>
                    <p style="margin:6px 0; background:#f5f5f5; padding:4px; font-size:0.85rem;">${hazard.description || 'No description.'}</p>
                    <b>Status:</b> ${hazard.status}
                </div>
            `);
        }

        async function updateStatus(docId, statusString) {
            const docRef = doc(db, "hazards", docId);
            await updateDoc(docRef, { status: statusString });
        }

        async function processInlinePhoto(docId, inputId, storagePrefix, databaseProperty, statusString) {
            const fileElement = document.getElementById(`${inputId}-${docId}`);
            if (!fileElement || !fileElement.files[0]) return alert("Please capture an image first!");
            
            const actionBtn = fileElement.nextElementSibling;
            const originalText = actionBtn.innerText;
            actionBtn.innerText = "Syncing Upload...";
            actionBtn.disabled = true;

            const base64Data = await compressAndConvertImage(fileElement.files[0]);
            const downloadUrl = await uploadPhotoToCloudStorage(base64Data, storagePrefix);

            if (downloadUrl) {
                const docRef = doc(db, "hazards", docId);
                const updates = { status: statusString };
                updates[databaseProperty] = downloadUrl;
                
                await updateDoc(docRef, updates);
            } else {
                actionBtn.innerText = originalText;
                actionBtn.disabled = false;
                alert("Photo upload failed.");
            }
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            if(!grid) return;
            grid.innerHTML = '';
            const y = currentCalendarDate.getFullYear(), m = currentCalendarDate.getMonth();
            document.getElementById('cal-month-year').innerText = currentCalendarDate.toLocaleString('default', { month: 'long', year: 'numeric' });

            ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].forEach(d => {
                const l = document.createElement('div'); l.className = 'weekday-label'; l.innerText = d; grid.appendChild(l);
            });

            for (let i = 0; i < new Date(y, m, 1).getDay(); i++) {
                const e = document.createElement('div'); e.className = 'cal-day empty'; grid.appendChild(e);
            }

            for (let d = 1; d <= new Date(y, m + 1, 0).getDate(); d++) {
                const cell = document.createElement('div'); cell.className = 'cal-day'; cell.innerText = d;
                const iso = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                
                cell.classList.toggle('has-records', hazards.some(h => h.isoDate === iso));
                cell.classList.toggle('selected', selectedFilterDateString === iso);
                cell.onclick = () => {
                    selectedFilterDateString = selectedFilterDateString === iso ? null : iso;
                    document.getElementById('filter-banner').style.display = selectedFilterDateString ? 'flex' : 'none';
                    document.getElementById('filter-text').innerText = `Active Filter: ${iso}`;
                    renderCalendar(); synchronizeMarkerLayers(); updateSidebar();
                };
                grid.appendChild(cell);
            }
        }

        function adjustMonth(dir) { currentCalendarDate.setMonth(currentCalendarDate.getMonth() + dir); renderCalendar(); }
        function clearDateFilter() { selectedFilterDateString = null; document.getElementById('filter-banner').style.display = 'none'; renderCalendar(); synchronizeMarkerLayers(); updateSidebar(); }

        async function exportHazardsToPDF() {
            const targets = selectedFilterDateString ? hazards.filter(h => h.isoDate === selectedFilterDateString) : hazards;
            if (!targets.length) return;

            const btn = document.getElementById('global-pdf-btn');
            btn.disabled = true;

            const blueprint = document.getElementById('pdf-render-blueprint');
            blueprint.innerHTML = `<div class="pdf-header"><div class="pdf-title">Incident Operations Report</div></div>`;

            targets.forEach((r, idx) => {
                const card = document.createElement('div');
                card.className = 'pdf-card';
                card.innerHTML = `
                    <div class="pdf-card-title">#${idx + 1} - ${r.title} [${r.status}]</div>
                    <div class="pdf-row">
                        <div class="pdf-details"><b>Location:</b> ${floorLabels[r.floorSlot]}<br><b>By:</b> ${r.staff}<br><p>${r.description || ''}</p></div>
                        <div class="pdf-img-container">
                            <div class="pdf-img-box"><span>Close-up</span><img src="${r.closeupPhoto || ''}"></div>
                            <div class="pdf-img-box"><span>Wide-angle</span><img src="${r.wideanglePhoto || ''}"></div>
                            <div class="pdf-img-box"><span>Interim</span><img src="${r.interimPhoto || ''}"></div>
                            <div class="pdf-img-box"><span>Mitigated</span><img src="${r.afterPhoto || ''}"></div>
                        </div>
                    </div>`;
                blueprint.appendChild(card);
            });

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const canvas = await html2canvas(blueprint, { scale: 1.5, useCORS: true });
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 10, 15, 190, (canvas.height * 190) / canvas.width);
            pdf.save('Hazard-Report.pdf');
            blueprint.innerHTML = ""; btn.disabled = false;
        }

        function updateSidebar() {
            const container = document.getElementById('hazard-list');
            if(!container) return;
            container.innerHTML = '';
            const targets = selectedFilterDateString ? hazards.filter(h => h.isoDate === selectedFilterDateString) : hazards;

            targets.forEach(h => {
                const item = document.createElement('div');
                item.className = `hazard-item ${h.status === 'Resolved' ? 'resolved' : h.status === 'Made Safe' ? 'madesafe' : ''}`;
                if (h.floorSlot !== currentActiveFloor) item.style.opacity = "0.5";

                let content = `
                    <h3>${h.title} <span style="font-size:0.65rem; background:#34495e; color:white; padding:2px; border-radius:3px; float:right;">${floorLabels[h.floorSlot]}</span></h3>
                    <span class="hazard-meta"><b>Logged:</b> ${h.staff} on ${h.timestamp}</span>
                    <div class="log-container">
                        <div class="log-box"><img src="${h.closeupPhoto || ''}"><span>Close-up</span></div>
                        <div class="log-box"><img src="${h.wideanglePhoto || ''}"><span>Wide</span></div>
                        <div class="log-box"><img src="${h.interimPhoto || ''}"><span>Interim</span></div>
                        <div class="log-box"><img src="${h.afterPhoto || ''}"><span>Mitigated</span></div>
                    </div>
                    <span class="status">${h.status}</span>`;

                if (h.status !== 'Resolved') {
                    content += `<div style="margin-top:10px; display:flex; flex-direction:column; gap:4px;">`;
                    if (h.status !== 'Made Safe') {
                        content += `
                            <input type="file" id="inline-interim-file-${h.docId}" accept="image/*" capture="environment">
                            <button class="action-btn safe-btn" onclick="event.stopPropagation(); updateSidebarInterimPhoto('${h.docId}')">🛡️ Mark Made Safe</button>`;
                    }
                    content += `
                        <input type="file" id="inline-after-file-${h.docId}" accept="image/*" capture="environment">
                        <button class="action-btn save-photo-btn" onclick="event.stopPropagation(); updateSidebarAfterPhoto('${h.docId}')">📸 Process Close-out</button>
                        <button class="action-btn resolve-btn" onclick="event.stopPropagation(); setStatusResolved('${h.docId}')">✔ Manual Resolve</button>
                    </div>`;
                } else {
                    content += `<button class="action-btn reopen-btn" onclick="event.stopPropagation(); setStatusUnresolved('${h.docId}')">↩ Reopen Case</button>`;
                }

                item.innerHTML = content;
                item.onclick = () => {
                    if (h.floorSlot !== currentActiveFloor) selectFloorSlot(h.floorSlot);
                    setTimeout(() => { map.setView([h.lat, h.lng], -1); }, 50);
                };
                container.appendChild(item);
            });
        }

        // ==========================================
        //  CRITICAL FIX: GLOBAL MODULE WINDOW EXPOSURE
        // ==========================================
        window.selectFloorSlot = selectFloorSlot;
        window.handleFloorplanUpload = handleFloorplanUpload;
        window.setStatusResolved = setStatusResolved;
        window.setStatusUnresolved = setStatusUnresolved;
        window.updateSidebarInterimPhoto = updateSidebarInterimPhoto;
        window.updateSidebarAfterPhoto = updateSidebarAfterPhoto;
        window.adjustMonth = adjustMonth;
        window.clearDateFilter = clearDateFilter;
        window.exportHazardsToPDF = exportHazardsToPDF;

    </script><
